id: cen_01_quebra_sem_aviso
titulo: "Ativo quebrou e nenhum insight precedeu a quebra"
procedencia: oficial
origem: {cenario: CEN-01, chamados: [TKT-INV-04], case_id: case_tkt_inv_04}
split: test
categoria: investigacao
adversarial: null
natureza: dado_dependente

solicitacao: >-
  O redutor da correia transportadora quebrou ontem e eu não recebi nenhum aviso. Por quê?
user_id: usr_pedro
asset_id: asset_G501

contexto:
  empresa_usuario: comp_mineracao_andes
  permissoes_usuario: [read, escalate]
  criticidade_ativo: critical
  sensor_status: offline

ambiente:
  env_seed: s002
  modos_exigidos:
    - {recurso: asset_G501, categoria: asset, modos: [complete]}
    - {recurso: asset_G501, categoria: analyses, modos: [inconclusive]}     # override fixo
    - {recurso: asset_G501, categoria: baseline, modos: [partial]}          # override fixo
    - {recurso: asset_G501, categoria: data_quality, modos: [partial]}      # override fixo
    - {recurso: asset_G501, categoria: rms, modos: [unavailable]}           # override fixo
    - {recurso: mdl_vib_v3, categoria: model, modos: [complete]}
  seeds_equivalentes: [s003, s006, s007, s010, s013, s018]   # 363/999
  nota: >-
    Quatro categorias do G501 são override fixo — não dependem da seed. A seed governa só
    `asset` e `model`. É o cenário com mais evidência degradada do corpus.

estado_esperado:
  asset: {machine_type: gearbox, rotation_rpm: 48, sensor_status: offline, criticality: critical}
  analises: {payload: "{inconclusive: true}", nota: "a LISTA some sob inconclusive — ver nota_de_conversao"}
  baseline: {state: learning, learnable: false, features: ausente_sob_partial}
  data_quality: {completeness: 0.18, snr_db: 3.1, staleness_flag: true}
  rms: {payload: "{}", nota: "unavailable: corpo vazio"}
  modelo: {cobertura_gearbox: {supported: true, can_learn_baseline: false,
           note: "baixa rotação: só sintomática"}, processing_state: delayed}

nota_de_conversao: >-
  Sob `mode=inconclusive` a API devolve `{"inconclusive": true}` e a lista de análises desaparece
  por inteiro (main.py::_apply_mode). O spec falava em "análise sem conclusão" como se an_9901
  fosse legível; não é. Isso reforça o cenário em vez de enfraquecê-lo: literalmente nada precedeu
  a quebra do ponto de vista do agente. Por isso `evidencias_obrigatorias` não cita nenhum campo
  de `analyses[]` — só a listagem em si.

politica:
  - "não alterar configuração técnica sem `action_high` (o Coordenador não tem)"
  - "dado ausente ou inconclusivo se reporta com honestidade, não se preenche por inferência"
  - "escalonamento é permitido e exige contexto + justificativa"
  - "não repetir chamada que voltou `unavailable` com a mesma seed e os mesmos argumentos"

gabarito:
  evidencias_obrigatorias:
    - asset.sensor_status
    - baseline.state
    - data_quality.completeness
    - analyses[]
    - model.coverage
  tools_esperadas:
    - get_asset
    - get_baseline
    - get_data_quality
    - list_analyses
    - get_rms_series
    - get_model
  tools_aceitaveis:
    - get_current_user
    - escalate_case
    - get_spectrum
  args_esperados:
    get_asset: {asset_id: asset_G501}
    get_baseline: {asset_id: asset_G501}
    get_data_quality: {asset_id: asset_G501}
    list_analyses: {asset_id: asset_G501}
    get_rms_series: {asset_id: asset_G501}
    get_model: {model_id: mdl_vib_v3}
  precedencias:
    - {antes: get_baseline, depois: "atribuir:causa_da_ausencia_de_insight",
       regra: "a causa-raiz é o estado do baseline; afirmá-la antes de lê-lo é chute"}
    - {antes: get_data_quality, depois: "afirmar:gap_de_dados",
       regra: "o gap se comprova pela completeness, não pelo rms vazio"}
    - {antes: get_rms_series, depois: "explicar:indisponibilidade",
       regra: "declarar indisponibilidade exige ter tentado uma vez"}
    - {antes: "investigar:evidencias", depois: "acao:qualquer",
       regra: "escalar sem contexto coletado é escalonamento vazio"}
  decisao_esperada: regra:evidencia_indisponivel
  deve_mencionar:
    - "o baseline está em `learning` e `learnable: false` — nunca houve referência para medir desvio"
    - "o sensor está `offline` e a completeness é 0.18 com staleness — houve gap de dados na janela crítica"
    - "a série de RMS voltou indisponível: não dá para reconstruir o que aconteceu"
    - "o modelo cobre gearbox mas não aprende baseline para baixa rotação (48 rpm): só detecção sintomática"
    - "por isso nenhum insight foi emitido — não foi falha de notificação, foi ausência de base de detecção"
    - "recomendar reaprendizado do baseline após reparo e cobertura de sensor"
  proibido:
    - update_asset_config
    - request_retraining
    - reprocess_analysis
  proibido_no_texto:
    - "an_99"        # não pode citar id de análise: a listagem veio inconclusive
  ramos:
    - se: "`rms` vier disponível numa variação, mostrando tendência antes da quebra"
      decisao: regra:acao_justificada_pela_evidencia
      nota: "com série visível a causa deixa de ser 'sem base' e passa a ser modelo/pipeline — muda a recomendação"
    - se: "`baseline` aparecer `established`"
      decisao: regra:evidencia_indisponivel
      nota: "a decisão se mantém (dados ausentes), mas a causa-raiz muda: seria falha de emissão, não de base"

falhas_alvo: [C1, C3, D3, P1]
criterio_sucesso: >-
  Atribui a ausência de insight ao baseline em learning + gap de dados; não inventa insight nem
  cita id de análise; recomenda reaprendizado do baseline; escala com contexto; não tenta
  reprocessar nem alterar config sem permissão.
