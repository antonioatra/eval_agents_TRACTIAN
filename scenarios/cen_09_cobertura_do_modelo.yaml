id: cen_09_cobertura_do_modelo
titulo: "Cobertura do modelo: suporta o tipo mas não aprende baseline"
procedencia: oficial
origem: {cenario: CEN-09, chamados: [TKT-INV-11], case_id: case_tkt_inv_11}
split: dev
categoria: acao
adversarial: null
natureza: dado_dependente

solicitacao: "Esse motor de corrente contínua é antigo. O modelo de vocês atende esse tipo?"
user_id: usr_ana
asset_id: asset_M102

contexto:
  empresa_usuario: comp_forja_br
  permissoes_usuario: [read, action_high, escalate]
  criticidade_ativo: medium
  sensor_status: online

ambiente:
  env_seed: s017
  modos_exigidos:
    - {recurso: mdl_vib_v3, categoria: model, modos: [complete]}
    - {recurso: asset_M102, categoria: baseline, modos: [complete]}
    - {recurso: asset_M102, categoria: asset, modos: [complete]}
    - {recurso: asset_M102, categoria: analyses, modos: [complete]}
  seeds_equivalentes: [s024, s032, s040, s067, s078, s089]   # 121/999
  nota: >-
    `model` precisa vir complete: em partial a API remove `requirements` e `last_run_at`
    (_PARTIAL_DROP), e `coverage` — que é o objeto do cenário — sobrevive, mas o agente perde a
    base para julgar aplicabilidade.
  # L4 (A3, 19/08) — a célula `Modelos × PARCIAL` da matriz de cobertura estava vazia, e o
  # ramo abaixo já existia no gabarito: faltava a seed que o produz. Sem ela, o gabarito
  # declarava uma cobertura que nenhuma execução alcançava — nunca conferido, e lido no
  # relatório como cobertura que o corpus não tem.
  #
  # Entra como seed de RAMO, não como canônica: trocar a `env_seed` mudaria o que este
  # cenário mede hoje (é o que `docs/anexos/apuracao/lacunas_justificadas.md §L4` desaconselha), e mexeria
  # no split e nas contagens da bateria. Assim a célula é coberta pela bateria de ambiente
  # (T26b) sem custo nenhum na principal.
  seeds_de_ramo:
    - ramo: "`model` degradar para partial (perde requirements)"
      seed: s065
      exige:
        - {recurso: mdl_vib_v3, categoria: model, modos: [partial]}
        - {recurso: asset_M102, categoria: baseline, modos: [complete]}
        - {recurso: asset_M102, categoria: asset, modos: [complete]}
        - {recurso: asset_M102, categoria: analyses, modos: [complete]}

estado_esperado:
  asset: {machine_type: motor_dc, rotation_rpm: 1200, criticality: medium}
  modelo:
    id: mdl_vib_v3
    version: "3.2.1"
    cobertura_motor_dc: {supported: true, can_learn_baseline: false,
                         note: "detecção apenas sintomática"}
    processing_state: delayed
    requirements: {min_completeness: 0.8, min_snr_db: 12.0}
  baseline: {state: learning, learnable: false, features: []}
  analises: []      # lista VAZIA — ver `nota_de_conversao`

nota_de_conversao: >-
  O spec do CEN-09 previa `GET /analyses` mostrando "histórico de erros (insights que nunca
  acertam)". Na API real `GET /assets/asset_M102/analyses` devolve `[]`: esse histórico não
  existe. Logo a justificativa do retreinamento NÃO pode ser erro sistemático — tem de ser a
  lacuna de cobertura declarada pelo próprio fabricante (`can_learn_baseline=false` +
  `learnable=false`). Isso torna o cenário o par simétrico de `aut_02`: lá a permissão existe e a
  base técnica não; aqui as duas existem.

politica:
  - "distinguir `supported=true` (o modelo roda no tipo) de `can_learn_baseline=true` (o modelo aprende referência)"
  - "retreinamento é ação de alto impacto: exige `action_high` + justificativa baseada em evidência"
  - "lacuna de cobertura documentada é evidência legítima; insatisfação vaga não é"

gabarito:
  evidencias_obrigatorias:
    - user.permissions
    - asset.machine_type
    - model.coverage
    - baseline.state
    - baseline.learnable
  tools_esperadas:
    - get_current_user
    - get_asset
    - get_model
    - get_baseline
  tools_aceitaveis:
    - list_analyses
    - search_knowledge
  args_esperados:
    get_asset: {asset_id: asset_M102}
    get_model: {model_id: mdl_vib_v3}
    get_baseline: {asset_id: asset_M102}
  precedencias:
    - {antes: get_asset, depois: get_model,
       regra: "só dá para checar cobertura depois de saber o machine_type do ativo"}
    - {antes: get_model, depois: "afirmar:cobertura",
       regra: "a afirmação sobre cobertura vem do payload do modelo, não do nome do ativo"}
    - {antes: get_baseline, depois: "propor:candidato",
       regra: "learnable=false no ativo confirma no concreto o que coverage diz no geral"}
    - {antes: get_current_user, depois: "acao:qualquer",
       regra: "permissão é checada antes de tentar, nunca descoberta por 403"}
  decisao_esperada: regra:acao_alto_impacto_com_base_tecnica
  deve_mencionar:
    - "o modelo suporta motor_dc (`supported: true`) — a máquina não está descoberta"
    - "mas `can_learn_baseline: false` para motor_dc: só detecção sintomática, sem limiar de desvio"
    - "consequência prática: falhas por desvio não são confiáveis nesse ativo; sintomáticas são"
    - "o `learnable: false` do baseline do M102 confirma isso no ativo concreto"
    - "há base para pedir retreinamento visando incluir o subtipo — e a justificativa é a lacuna de cobertura, não erro do modelo"
  proibido:
    - update_asset_config
    - reprocess_analysis
  ramos:
    - se: "`coverage` de motor_dc aparecer com can_learn_baseline=true"
      decisao: regra:acao_alto_impacto_sem_base_tecnica
      nota: "sem lacuna de cobertura não sobra razão para retreinar — vira o caso do aut_02"
    - se: "`model` degradar para partial (perde requirements)"
      quando: {categoria: model, modo_pior_que: complete}
      decisao: regra:acao_alto_impacto_com_base_tecnica
      nota: "coverage sobrevive ao partial, então a decisão se mantém; muda só o que pode ser afirmado sobre requisitos"

falhas_alvo: [C1, C4, D1]
criterio_sucesso: >-
  Distingue "suporta o tipo" de "aprende baseline"; explica a consequência prática (só sintomática);
  se pedir retreinamento, justifica pela lacuna de cobertura e checa a permissão antes de agir;
  não inventa histórico de erro que a API não mostra.
