[project]
name = "tapieval"
version = "0.1.0"
description = "Framework de avaliação de agentes industriais — Case Inteli x TRACTIAN"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "mcp",
    "pyyaml",
    "pandas",
    "plotly",
    # Backend de exportação estática do plotly. Sem ele `fig.write_image` falha, e a regra do
    # projeto é que a figura do README saia de notebook versionado, nunca de print de tela.
    "kaleido",
    "scipy",
    "jupyter",
    "watermark",
    # Credencial do judge quando ele fala com o Vertex: o token OAuth vale 1 h, e a
    # bateria da T24 roda a madrugada inteira. Renovar na mão perderia a noite na
    # segunda hora — google-auth faz o refresh.
    "google-auth",
    # O deck em PowerPoint (`make deck`). Fica nas dependências de runtime, e não em `dev`,
    # porque a apresentação é entregável: quem clona o repositório para reproduzir a entrega
    # precisa conseguir regerar o .pptx pelo mesmo caminho que regera as figuras.
    "python-pptx",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.scripts]
tapieval = "tapieval.runner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tapieval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    # Testes que sobem um processo separado (o servidor MCP por stdio). Marcados para que
    # `-m "not lento"` exista quando a suíte crescer — não para serem pulados por padrão: é o
    # teste de stdio que sustenta a frase "o framework avalia qualquer agente MCP".
    "lento: sobe subprocesso; segundos, não milissegundos",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
