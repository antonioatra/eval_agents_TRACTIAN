[project]
name = "tapieval"
version = "0.1.0"
description = "Framework de avaliação de agentes industriais — Case Inteli x TRACTIAN"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "mcp",
    "pyyaml",
    "pandas",
    "plotly",
    # Backend de exportação estática do plotly. Sem ele `fig.write_image` falha, e a regra do
    # projeto é que a figura do README saia de notebook versionado, nunca de print de tela.
    "kaleido",
    "scipy",
    "jupyter",
    "watermark",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.scripts]
tapieval = "tapieval.runner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tapieval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
